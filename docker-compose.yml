services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: talentbridge-api
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - talentbridge_network

  # Frontend Client Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: talentbridge-client
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - talentbridge_network

networks:
  talentbridge_network:
    driver: bridge
